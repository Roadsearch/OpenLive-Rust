name: Android native library

on:
  push:
    paths:
      - "rust-sync-core/**"
      - "android-integration/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "rust-sync-core/**"
      - "android-integration/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Rust libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Locate preinstalled Android NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          NDK_PATH="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_PATH" ]; then
            echo "No Android NDK found under $SDK_ROOT/ndk" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK_PATH"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build shared libraries
        working-directory: rust-sync-core
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../android-integration/jniLibs build --release
      - name: Verify native libraries and JNI exports
        shell: bash
        run: |
          set -euo pipefail
          LLVM_NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          LIBS=(
            "android-integration/jniLibs/arm64-v8a/librust_sync_core.so"
            "android-integration/jniLibs/armeabi-v7a/librust_sync_core.so"
          )
          SYMBOLS=(
            "Java_com_example_core_clock_RustSyncEngine_nativeStartSession"
            "Java_com_example_core_clock_RustSyncEngine_nativeStopSession"
            "Java_com_example_core_clock_RustSyncEngine_nativeNowNs"
            "Java_com_example_core_clock_RustSyncEngine_nativeNsToUs"
            "Java_com_example_core_clock_RustSyncEngine_nativeNsToMs"
            "Java_com_example_core_audio_RustAudioProcessor_nativeCreate"
            "Java_com_example_core_audio_RustAudioProcessor_nativeDestroy"
            "Java_com_example_core_audio_RustAudioProcessor_nativeProcess"
          )
          for lib in "${LIBS[@]}"; do
            test -f "$lib"
            echo "Checking JNI exports in $lib"
            exports="$("$LLVM_NM" -D --defined-only "$lib")"
            for symbol in "${SYMBOLS[@]}"; do
              if ! grep -Fq "$symbol" <<< "$exports"; then
                echo "Missing JNI symbol: $symbol in $lib" >&2
                exit 1
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: openlive-rust-android-libraries
          path: android-integration/jniLibs/
