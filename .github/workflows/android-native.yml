name: Android native library

on:
  push:
    paths:
      - "rust-sync-core/**"
      - "android-integration/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "rust-sync-core/**"
      - "android-integration/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Rust libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - name: Locate preinstalled Android NDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          NDK_PATH="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$NDK_PATH" ]; then
            echo "No Android NDK found under $SDK_ROOT/ndk" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using NDK at $NDK_PATH"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build shared libraries
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o android-integration/jniLibs build --manifest-path rust-sync-core/Cargo.toml --release
      - name: Verify native libraries exist
        run: |
          test -f android-integration/jniLibs/arm64-v8a/librust_sync_core.so
          test -f android-integration/jniLibs/armeabi-v7a/librust_sync_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: openlive-rust-android-libraries
          path: android-integration/jniLibs/
