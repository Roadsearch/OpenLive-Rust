name: Android native library

on:
  push:
    paths:
      - "rust-sync-core/**"
      - "android-integration/**"
      - ".github/workflows/android-native.yml"
  pull_request:
    paths:
      - "rust-sync-core/**"
      - "android-integration/**"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

jobs:
  build-arm64:
    name: Build Android arm64-v8a Rust library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build shared library
        run: cargo ndk -t arm64-v8a -o android-integration/jniLibs build --manifest-path rust-sync-core/Cargo.toml --release
      - name: Verify native library exists
        run: test -f android-integration/jniLibs/arm64-v8a/librust_sync_core.so
      - uses: actions/upload-artifact@v4
        with:
          name: openlive-rust-android-arm64
          path: android-integration/jniLibs/arm64-v8a/librust_sync_core.so
