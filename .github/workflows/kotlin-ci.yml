name: Kotlin integration tests

on:
  push:
    paths:
      - "android-integration/**"
      - ".github/workflows/kotlin-ci.yml"
  pull_request:
    paths:
      - "android-integration/**"
      - ".github/workflows/kotlin-ci.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test Kotlin clock adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Run Kotlin unit tests
        run: gradle -p android-integration test
